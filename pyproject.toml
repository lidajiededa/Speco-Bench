[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speco-bench"
version = "0.1.0"
description = "A lightweight fixed-concurrency benchmark for speculative decoding services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Speco-Bench contributors" }]
dependencies = [
  "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
random = [
  "transformers>=4.45,<6",
]

[project.scripts]
speco-bench = "speco_bench.cli:main"
speco-bench-matrix = "speco_bench.matrix:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
